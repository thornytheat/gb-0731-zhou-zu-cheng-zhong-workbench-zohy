<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>冷存归档工作台 · 轴组称重</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/layout.css">
  <link rel="stylesheet" href="/static/components.css">
  <script type="module" src="/static/archive.js"></script>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <a class="brand" href="/archive">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>冷存归档<small>COLD ARCHIVE</small></span>
      </a>
      <nav class="rail-nav" aria-label="归档动作">
        <span class="nav-label">工作台</span>
        <a class="nav-link" href="/">称重作业台 ↩</a>
        <a class="nav-link" href="/docs">接口文档 ↗</a>
      </nav>
      <div class="rail-foot"><span>规则版本</span><strong id="rule-version">—</strong></div>
    </aside>
    <div class="work">
      <main class="content archive-page">
        <section class="panel">
          <h2>容量规划 · 先转冷范围</h2>
          <div class="toolbar">
            <label>需要腾出字节 <input id="need-bytes" type="number" min="1" value="4096"></label>
            <button type="button" id="plan-button" class="primary">划定范围</button>
            <span id="plan-verdict" class="verdict"></span>
          </div>
          <div id="plan-output"></div>
        </section>

        <section class="panel">
          <h2>冷存台账</h2>
          <div class="toolbar">
            <button type="button" id="refresh-ledger">刷新台账</button>
          </div>
          <div id="ledger-output"></div>
        </section>

        <section class="panel">
          <h2>批次操作</h2>
          <div class="toolbar wrap">
            <label>批次 run_id <input id="run-id" type="text" size="44" placeholder="选择台账行后自动填入"></label>
            <button type="button" data-action="eligibility">资格</button>
            <button type="button" data-action="freeze">封冻</button>
            <button type="button" data-action="seal">验封</button>
            <button type="button" data-action="purge" class="danger">验封后清理</button>
            <button type="button" data-action="restore">恢复核对</button>
            <button type="button" data-action="dry-restore">恢复演练</button>
          </div>
          <div class="toolbar wrap">
            <label>抽查车次 <input id="pass-id" type="text" size="10" placeholder="如 0007"></label>
            <button type="button" data-action="readback">抽查回读</button>
            <label>保留主题 <input id="hold-subject" type="text" size="16" placeholder="审计抽查-Q4"></label>
            <label>原因 <input id="hold-reason" type="text" size="20" placeholder="随时回读"></label>
            <button type="button" data-action="hold">放置保留单</button>
          </div>
          <div id="action-output" class="action-output"></div>
        </section>

        <section class="panel">
          <h2>抽查保留单与归档事件</h2>
          <div class="toolbar">
            <button type="button" id="refresh-holds">刷新保留单</button>
            <button type="button" id="refresh-events">刷新事件</button>
          </div>
          <div id="holds-output"></div>
          <div id="events-output"></div>
        </section>
      </main>
      <footer class="statusbar">
        <span><i class="lamp" id="service-lamp"></i><span id="service-state">正在连接</span></span>
        <span>冷包 Merkle 封条 · 验封后才可清理</span>
      </footer>
    </div>
  </div>
</body>
</html>
